# Limita las ráfagas hacia la API por dirección IP.
# Una ráfaga que supere la capacidad configurada recibe HTTP 429.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    # Cabeceras mínimas de seguridad exigidas por R03.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;


    # R21 + R29: HAPI FHIR se expone por la URL pública SOLO para lo que necesita
    # un sistema externo de laboratorio: crear (POST) o actualizar (PUT) una
    # Observation, y leer el CapabilityStatement. Todo lo demás de HAPI (leer
    # pacientes, borrar recursos, cambiar la Subscription...) queda cerrado:
    # la API llega a HAPI por la red interna de Docker, no por aquí.
    # Ejemplo: POST https://<tunnel>.trycloudflare.com/fhir/Observation
    location = /fhir/Observation {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        client_max_body_size 1M;

        proxy_pass http://hapi-fhir:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~ "^/fhir/Observation/[A-Za-z0-9.-]{1,64}$" {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        limit_except PUT { deny all; }
        client_max_body_size 1M;

        proxy_pass http://hapi-fhir:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /fhir/metadata {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        limit_except GET { deny all; }

        proxy_pass http://hapi-fhir:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /fhir/ {
        default_type application/fhir+json;
        return 403 '{"resourceType":"OperationOutcome","issue":[{"severity":"error","code":"forbidden","diagnostics":"Ruta FHIR no expuesta. Las remisiones entran por /api/fhir/remisiones-r30/recibir con credenciales de institucion."}]}';
    }

    location /api/eventos/ {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000/eventos/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";          # conexión persistente con la API
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;                     # cada evento sale apenas la API lo escribe
        proxy_cache off;                         # un flujo en vivo nunca se guarda en caché
        proxy_read_timeout 1h;                   # la conexión vive mucho; la API manda ping cada 15 s
    }

    location /api/ {
        # Permite tráfico normal y pequeñas ráfagas; el exceso devuelve 429.
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # El front cambia con frecuencia: que ni el navegador ni Cloudflare
        # guarden en caché HTML/JS/CSS y siempre se vea la última versión.
        # (add_header en un location reemplaza los del server, por eso se repiten.)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }
}
