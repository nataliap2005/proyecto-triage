<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Triage Hospitalario</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main>
    <section id="vista-login">
      <h1>Sistema de Triage Hospitalario</h1>
      <h2>Iniciar sesión</h2>

      <form id="login-form">
        <label for="username">Usuario</label>
        <input
          type="text"
          id="username"
          name="username"
          autocomplete="username"
          required
        >

        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        >

        <button type="submit">Ingresar</button>
      </form>

      <p id="login-mensaje"></p>
    </section>

    <section id="vista-panel" hidden>
      <h1>Sistema de Triage Hospitalario</h1>

      <p>
        Bienvenido,
        <strong id="usuario-actual"></strong>
      </p>

      <p>
        Rol:
        <strong id="rol-actual"></strong>
      </p>

      <div id="contenido-rol"></div>

      <button id="cerrar-sesion" type="button">
        Cerrar sesión
      </button>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
