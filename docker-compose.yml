services:
  # PostgreSQL local de la aplicación (R05). La API clínica usa hoy Neon
  # (PG_CONNECTION_STRING en back/pass.env); este servicio queda disponible
  # como base local alternativa y no expone puertos al host.
  # Semana 12: imagen con pgvector para guardar los embeddings del RAG
  # (en Neon basta CREATE EXTENSION vector, que hace rag/indexar.py).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: triaje-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-triaje}
      POSTGRES_USER: ${APP_DB_USER:-triaje}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:-triaje_local}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    volumes:
    - app_postgres_data:/var/lib/postgresql/data
  hapi-postgres:
    image: postgres:16-alpine
    container_name: triaje-hapi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HAPI_DB_NAME}
      POSTGRES_USER: ${HAPI_DB_USER}
      POSTGRES_PASSWORD: ${HAPI_DB_PASSWORD}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    volumes:
    - hapi_postgres_data:/var/lib/postgresql/data
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: triaje-hapi-fhir
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hapi-postgres:5432/${HAPI_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${HAPI_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${HAPI_DB_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_OPENAPI_ENABLED: 'true'
      HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED: 'true'   # R21: activa las Subscription rest-hook
    ports:
    - 8080:8080
    depends_on:
      hapi-postgres:
        condition: service_healthy
  orthanc:
    image: orthancteam/orthanc:latest
    container_name: triaje-orthanc
    restart: unless-stopped
    environment:
      ORTHANC_JSON: "{\n  \"Name\": \"Triaje Hospitalario PACS\",\n  \"DicomAet\"\
        : \"TRIAJEPACS\",\n  \"RemoteAccessAllowed\": true,\n  \"AuthenticationEnabled\"\
        : true,\n  \"RegisteredUsers\": {\n    \"${ORTHANC_USERNAME:-orthanc}\": \"\
        ${ORTHANC_PASSWORD:-orthanc}\"\n  }\n}\n"
    ports:
    - 8042:8042
    - 4242:4242
    volumes:
    - orthanc_data:/var/lib/orthanc/db
  mongodb:
    image: mongo:7
    container_name: triaje-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-triaje}
    healthcheck:
      test:
      - CMD
      - mongosh
      - --quiet
      - --eval
      - db.adminCommand('ping').ok
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 10
    volumes:
    - mongodb_data:/data/db
  api:
    build:
      context: ./back
      dockerfile: Dockerfile
      additional_contexts:
        rag: ./rag          # Semana 12: el Dockerfile copia rag/ a /app/rag
    container_name: triaje-api
    restart: unless-stopped
    env_file:
    - ./back/pass.env
    environment:
      HAPI_FHIR_URL: http://hapi-fhir:8080/fhir
      ORTHANC_URL: http://orthanc:8042
      ORTHANC_USERNAME: ${ORTHANC_USERNAME:-orthanc}
      ORTHANC_PASSWORD: ${ORTHANC_PASSWORD:-orthanc}
      MONGO_CONNECTION_STRING: mongodb://mongodb:27017/${MONGO_DB_NAME:-triaje}
      FHIR_HOOK_URL: http://api:8000/fhir-hook
      ML_URL: http://ml:8001
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
      SEUDONIMO_SECRETO: ${SEUDONIMO_SECRETO}
      ALERTA_ESCALAR_MINUTOS: ${ALERTA_ESCALAR_MINUTOS:-5}
    ports:
    - 8000:8000
    volumes:
    - ./historias_clinicas:/app/historias_clinicas
    depends_on:
      hapi-fhir:
        condition: service_started
      orthanc:
        condition: service_started
      mongodb:
        condition: service_healthy
      ml:
        condition: service_healthy
  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: triaje-frontend
    restart: unless-stopped
    ports:
    - 5500:80
    depends_on:
    - api
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: triaje-cloudflared
    restart: unless-stopped
    command:
    - tunnel
    - --no-autoupdate
    - --url
    - http://frontend:80
    depends_on:
    - frontend

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    container_name: triaje-ml
    restart: unless-stopped
    environment:
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
      
volumes:
  app_postgres_data: null
  hapi_postgres_data: null
  orthanc_data: null
  mongodb_data: null